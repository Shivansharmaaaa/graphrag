# Unit tests, live integration tests and the evaluation harness against ephemeral containers.
# No LLM runs in CI: GraphRAG is checked in retrieve-only mode (the NFR8 degradation path).
name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      neo4j:
        image: neo4j:5.26-community
        env:
          NEO4J_AUTH: neo4j/ctiplatform
        ports: ["7687:7687"]
        options: >-
          --health-cmd "cypher-shell -u neo4j -p ctiplatform 'RETURN 1'"
          --health-interval 10s --health-timeout 10s --health-retries 20 --health-start-period 20s
      mongo:
        image: mongo:7
        ports: ["27017:27017"]
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.adminCommand(\"ping\")'"
          --health-interval 5s --health-timeout 5s --health-retries 20
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: --health-cmd "redis-cli ping" --health-interval 5s --health-retries 20
      qdrant:
        image: qdrant/qdrant:v1.13.4
        ports: ["6333:6333"]
        options: >-
          --health-cmd "bash -c 'echo > /dev/tcp/127.0.0.1/6333'"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      OLLAMA_URL: http://127.0.0.1:9   # nothing listens here: exercises retrieve-only mode
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r requirements.txt
      - name: Unit tests
        run: python -m pytest -q
      - name: Integration tests (seeds the empty stores on first start)
        run: python -m pytest -q -m integration
      - name: Evaluation harness
        run: python -m scripts.evaluate --check
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: eval-report
          path: backend/eval_report.json
          if-no-files-found: ignore

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build
